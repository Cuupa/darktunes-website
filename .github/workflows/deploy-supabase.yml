name: Deploy Supabase

# MANUAL FALLBACK ONLY (workflow_dispatch).
# The schema is applied automatically by the Vercel production install step
# (scripts/vercel-install.sh), before the new code goes live. Use this workflow
# only to re-apply supabase/reset.sql by hand. Cron jobs stay in the Supabase
# dashboard (Integrations → Cron).
on:
  workflow_dispatch:

concurrency:
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard destructive SQL
        run: npm run check:destructive-sql

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply schema
        run: npm run db:apply
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
