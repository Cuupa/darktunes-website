name: Deploy Supabase

# Applies supabase/reset.sql to the production database after CI succeeds
# on a push to main (e.g. a fork sync), or manually via workflow_dispatch.
# Never from Vercel install. Cron jobs stay in the Supabase dashboard
# (Integrations → Cron).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply schema
    runs-on: ubuntu-latest
    # Only pushes to main: a PR whose head branch is also named "main"
    # (e.g. from a fork) must not reach the production database.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Apply exactly the commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard destructive SQL
        run: npm run check:destructive-sql

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply schema
        run: npm run db:apply
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
