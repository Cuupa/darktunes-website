name: QA Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  e2e-tests:
    runs-on: ubuntu-latest
    env:
      # Cloudflare R2 isn't exercised by any E2E test (no test hits real
      # object storage) — static placeholders just satisfy env validation.
      # Safe to keep set for every step, unlike the Supabase vars below.
      CLOUDFLARE_R2_ACCOUNT_ID: placeholder-r2-account
      CLOUDFLARE_R2_ACCESS_KEY_ID: placeholder-r2-access-key
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: placeholder-r2-secret-key
      CLOUDFLARE_R2_BUCKET_NAME: placeholder-bucket
      CLOUDFLARE_R2_PUBLIC_URL: https://cdn.placeholder.example
      # Required by src/lib/env.server.ts's Zod schema (64-char hex) wherever
      # api_credentials encrypt/decrypt code runs (e.g. /portal at runtime,
      # not just build) — no E2E test exercises real encrypted credentials,
      # so a fixed placeholder is fine. Safe to keep set for every step.
      API_CREDENTIALS_ENCRYPTION_KEY: a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8
      # Have global-teardown.ts stop the Docker stack at the end of the run
      # (default off locally so iterative dev doesn't repay container startup
      # cost every time — see tests/e2e/global-teardown.ts).
      E2E_STOP_DB_AFTER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Ensure psql client is available
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)
      - run: npm ci
      - run: npx playwright install --with-deps
      # Starts the local Supabase stack (Docker), applies supabase/reset.sql,
      # seeds fixture content + auth users, and writes .env.e2e.local — see
      # scripts/e2e-db-setup.mjs and E2E-TESTS.md Phase 1/2. No repo secrets
      # involved: everything comes from this freshly provisioned local stack.
      - run: npm run db:e2e:start
      # The build MUST see the *real* local-stack credentials written by the
      # step above, not placeholders: NEXT_PUBLIC_* vars are inlined into the
      # client bundle at build time, so a placeholder Supabase URL bakes an
      # unreachable domain into every browser-side call — signInWithPassword
      # included — and every auth-dependent E2E test then dies on a login
      # timeout no matter how the server process is configured afterwards.
      # `set -a` exports each assignment in .env.e2e.local (plain unquoted
      # KEY=value lines, see scripts/e2e-db-setup.mjs) for this step only, so
      # nothing shadows playwright.config.ts's own dotenv load below.
      - name: Build against the local Supabase stack
        run: |
          set -a
          . ./.env.e2e.local
          set +a
          npm run build
      - run: SKIP_BUILD=1 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --production --audit-level=critical

  performance-tests:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key-for-ci-build' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: SKIP_BUILD=1 npm run perf:test

  ci-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test -- tests/unit/ci-colors.spec.ts
